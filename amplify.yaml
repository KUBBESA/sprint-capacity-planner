version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
        build:
          commands:
            - echo "Build completo - frontend en public/"
      artifacts:
        baseDirectory: public
        files:
          - '**/*'
      rewritesAndRedirects:
        # API routes → Lambda function
        - source: /auth/<*>
          target: https://9smw7p8nwh.execute-api.us-east-1.amazonaws.com/prod/auth/$1
          status: 200
        - source: /api/<*>
          target: https://9smw7p8nwh.execute-api.us-east-1.amazonaws.com/prod/api/$1
          status: 200
        # SPA fallback
        - source: /<*>
          target: /index.html
          status: 404
