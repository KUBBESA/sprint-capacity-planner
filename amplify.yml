version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Building Sprint Capacity Planner"
    build:
      commands:
        - echo "Build complete"
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  rewritesAndRedirects:
    - source: /auth/login
      target: https://9smw7p8nwh.execute-api.us-east-1.amazonaws.com/prod/auth/login
      status: 200
    - source: /auth/callback
      target: https://9smw7p8nwh.execute-api.us-east-1.amazonaws.com/prod/auth/callback
      status: 200
    - source: /auth/me
      target: https://9smw7p8nwh.execute-api.us-east-1.amazonaws.com/prod/auth/me
      status: 200
    - source: /auth/logout
      target: https://9smw7p8nwh.execute-api.us-east-1.amazonaws.com/prod/auth/logout
      status: 200
    - source: /api/jira/<*>
      target: https://9smw7p8nwh.execute-api.us-east-1.amazonaws.com/prod/api/jira/$1
      status: 200
    - source: /api/planner/<*>
      target: https://9smw7p8nwh.execute-api.us-east-1.amazonaws.com/prod/api/planner/$1
      status: 200
    - source: /<*>
      target: /index.html
      status: 404
